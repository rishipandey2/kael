<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filter for soft ambient incandescent glow on arc and orb -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Warm incandescent gradient for the luminous horizon arc -->
    <linearGradient id="horizonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8D5B5" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#FCEFD8" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="90%" stop-color="#F2DFBE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0.15" />
    </linearGradient>

    <!-- Orb radial gradient -->
    <radialGradient id="orbGlow" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FDF5E9" />
      <stop offset="100%" stop-color="#E5D0AD" />
    </radialGradient>

    <!-- Orb soft halo -->
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#F8EAD4" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle diffuse radial glow underneath the arc -->
    <radialGradient id="ambientUnderglow" cx="52%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FFF0D4" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#E8CFA4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep warm black canvas matching #0B0B0C -->
  <rect width="512" height="512" fill="#0B0B0C" />
  
  <!-- Subtle atmospheric warmth under the arc -->
  <ellipse cx="290" cy="310" rx="200" ry="140" fill="url(#ambientUnderglow)" transform="rotate(-14 290 310)" />

  <!-- Luminous horizon arc occupying full optical width (60 -> 450) -->
  <!-- Wide soft ambient stroke -->
  <path d="M 64 388 C 160 258, 305 204, 450 216" fill="none" stroke="#E6C898" stroke-width="16" opacity="0.22" filter="url(#glow)" />
  <!-- Medium incandescent stroke -->
  <path d="M 64 388 C 160 258, 305 204, 450 216" fill="none" stroke="#FDEED2" stroke-width="7" opacity="0.65" filter="url(#glow)" />
  <!-- Crisp luminous core line -->
  <path d="M 64 388 C 160 258, 305 204, 450 216" fill="none" stroke="url(#horizonGlow)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Celestial Orb hovering above the right shoulder -->
  <circle cx="418" cy="148" r="26" fill="url(#orbHalo)" />
  <circle cx="418" cy="148" r="21" fill="url(#orbGlow)" filter="url(#glow)" />
</svg>
