<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded rect mask -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>
    
    <!-- Horizon Arc Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Warm horizon gradient -->
    <linearGradient id="horizonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8D5B5" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#FFF2DC" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#F2DFBE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle diffuse radial glow underneath the arc -->
    <radialGradient id="ambientUnderglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0D4" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#E8CFA4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle top rim light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base surface -->
    <rect width="512" height="512" fill="#0B0B0C" />
    
    <!-- Ambient glow under the curve -->
    <ellipse cx="270" cy="270" rx="230" ry="170" fill="url(#ambientUnderglow)" transform="rotate(-18 270 270)" />

    <!-- Luminous horizon crescent -->
    <!-- Arc from bottom-left (x: 20, y: 380) sweeping gracefully upward to right (x: 500, y: 190) -->
    <!-- Wide diffused glow stroke -->
    <path d="M 10 395 Q 210 240 505 185" fill="none" stroke="#E6C898" stroke-width="14" opacity="0.25" filter="url(#glow)" />
    <!-- Medium glow stroke -->
    <path d="M 10 395 Q 210 240 505 185" fill="none" stroke="#FDEED2" stroke-width="6" opacity="0.6" filter="url(#glow)" />
    <!-- Sharp intense core line -->
    <path d="M 10 395 Q 210 240 505 185" fill="none" stroke="url(#horizonGlow)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtle rim reflection on top border -->
    <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="none" stroke="url(#rimLight)" stroke-width="2" />
  </g>
</svg>
