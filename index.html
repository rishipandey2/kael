<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>tāsk — Less noise. More done.</title>

    <!-- Meta Description & SEO -->
    <meta name="description" content="A completely personal, private, extremely fast, minimalist to-do application." />
    
    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tāsk" />

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icon-120.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS Startup Splash Images (PWA standalone mode) -->
    <link rel="apple-touch-startup-image" href="/apple-splash-1179-2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1290-2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1170-2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1125-2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1284-2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />

    <!-- Instant Inline Anti-Flash & Launch Screen Styling -->
    <style>
      html, body {
        background-color: #0B0B0C;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
      }
      #app-launch-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #0B0B0C;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 280ms cubic-bezier(0.16, 1, 0.3, 1), transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      #app-launch-screen.dismissed {
        opacity: 0;
        transform: scale(1.02);
      }
      .launch-screen-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        margin-top: calc(-1 * env(safe-area-inset-top, 0px) / 2);
      }
      .launch-logo-mark {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        object-fit: cover;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <!-- Seamless First-Frame Launch Screen -->
    <div id="app-launch-screen" aria-hidden="true">
      <div class="launch-screen-inner">
        <img src="/icon-180.png" alt="tāsk" class="launch-logo-mark" width="84" height="84" />
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
